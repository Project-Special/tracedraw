name: Feature request
description: Something TraceDraw should do and does not yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/features.md](https://github.com/igtoth/tracedraw/blob/main/docs/features.md) first: it lists every capability and its status.
  - type: textarea
    id: what
    attributes:
      label: What you would like to do
      description: The task, not only the button. How do you work today without it?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Sketches, screenshots, sample files.
