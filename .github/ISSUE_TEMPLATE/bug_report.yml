name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      placeholder: |
        1. Draw a rectangle
        2. Choose Object > ...
        3. ...
  - type: dropdown
    id: platform
    attributes:
      label: Where
      options:
        - Windows
        - macOS
        - Linux
        - In the browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TraceDraw version
      description: Help > About, or the name of the file you downloaded.
  - type: textarea
    id: files
    attributes:
      label: Files and screenshots
      description: A drawing that shows the problem (zipped), a screenshot, or the last lines of the log if TraceDraw stopped.
