# Keeps the pinned GitHub Actions (commit hashes in workflows/build.yml)
# and the Rust dependencies up to date, security fixes included.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
