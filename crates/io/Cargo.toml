[package]
name = "tracedraw-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Import/export between the TraceDraw document model and other formats (SVG, native .tdraw)"

[dependencies]
tracedraw-core.workspace = true
tracedraw-render.workspace = true
thiserror.workspace = true
base64 = "0.22"
flate2 = "1"
weezl = "0.1"
tiny-skia.workspace = true
usvg = { version = "0.48", default-features = false }
lopdf = { version = "0.46", default-features = false }
roxmltree = "0.21"
# Fonts embedded in PDF files: their tables (ttf-parser) and the subset of
# glyphs a file uses (subsetter, MIT OR Apache-2.0).
ttf-parser.workspace = true
subsetter = "0.2"
web-time = "1"
zip.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# PDF password protection (AES-256, revision 6) and its random keys;
# reading protected files also needs RC4 keys made with MD5.
aes = "0.8"
cbc = "0.2"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
getrandom = "0.3"

# lopdf draws random numbers (getrandom 0.3); in a browser they come from
# JavaScript (see .cargo/config.toml for the matching cfg).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# lopdf (and its rand) take randomness from getrandom 0.4, which needs
# the browser backend named in a browser build.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
